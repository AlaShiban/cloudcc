[project]
name = "cloudcompiler"
version = "0.1.0"
description = "Compile-time hints for CloudCompiler; the compiler reads these calls, never runs them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudcompiler"]
