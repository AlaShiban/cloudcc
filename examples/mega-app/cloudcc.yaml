# mega-app: one program that exercises every library category cloudcc should
# support. See README.md -- most of this does not compile yet, on purpose.
app: mega-app
provider: aws

# `type:` names the shape of compute, not the product: `function` is Lambda here
# and would be Azure Functions or Cloud Functions elsewhere. Portable settings
# sit beside it; anything one cloud offers beyond them goes in a block named
# after the resource.
execution_units:
  api:
    type: function
    memory: 512
    timeout: 30
    aws.lambda.Function:
      # PROPOSED: not yet supported. Layers are how a Django or a numpy build
      # gets out of the bundle, and the argument exists on the resource -- what
      # is missing is anything that produces one.
      layers: []
  checkout:
    type: function
  admin:
    # Django expects a long-lived process with connection pooling, so it gets a
    # container. A compiler that saw Django on `type: function` should say what
    # that costs rather than quietly agree.
    type: container
  worker:
    # Pinned by the Kafka consumer loop in worker.py: a consumer group cannot
    # be expressed as a Lambda event source without giving up the offset
    # semantics that were the reason to choose Kafka.
    type: container
  ops:
    # PROPOSED: run-to-completion. Not yet a supported type -- see ops.py.
    # `cloudcc run ops -- backfill --since 2026-01-01`
    type: task

exposed:
  storefront:
    type: apigateway
  checkout-api:
    type: apigateway
  admin-web:
    type: alb

# Where logs go. `cloudwatch` is the only value that works; `datadog` and
# `honeycomb` are recognised and refused, so choosing one is an error rather
# than a key that is silently dropped.
#
# The seam for a vendor is the destination, not the call sites: nothing in
# mega/logs.py changes when this does.
logging:
  type: cloudwatch
  retention_days: 14

persisted:
  # The client's type chose the capability; this section chooses between
  # variants of it, which is a configuration decision rather than a code
  # change.
  itemCache:
    type: memorydb          # rather than elasticache: worker.py subscribes to
                            # a Redis channel, and a cache that evicts under
                            # memory pressure is the wrong resource for that.
  megaDb:
    type: rds_postgres
  receipts:
    type: s3
  orders:
    type: dynamodb          # declared by wrapping a boto3 Table, not by an
                            # object cloudcc supplies.

  # Topics are deliberately NOT typed here. Their backing is chosen by the
  # compiler from the requirements declared in the code -- ordering, delivery,
  # replay -- because those are not interchangeable and picking by hand means
  # knowing which service satisfies which. See mega/messaging.py.
  #
  #   orderEvents  -> SNS + a queue per subscriber
  #   refundEvents -> SQS FIFO
  #   auditEvents  -> Kinesis Data Stream
  #
  # Naming a type here is still allowed, and it is checked rather than
  # obeyed: a type that cannot satisfy the declared requirements is an error.

  # PROPOSED below this line: none of these types exist yet.
  itemDocs:
    type: documentdb        # PyMongo. `atlas` should also be offered:
                            # DocumentDB is Mongo-compatible, not Mongo.
  workQueue:
    type: amazonmq_rabbit   # pika, kombu (amqp://)
  auditQueue:
    type: amazonmq_rabbit
  shipmentStream:
    type: msk_serverless    # aiokafka
  taskBroker:
    type: elasticache       # Celery's broker...
  taskResults:
    type: elasticache       # ...and its result backend. One client, two
                            # resources -- the only such case in the table.
  actorBroker:
    type: elasticache       # dramatiq

config:
  log_level:
    value: info
  django_secret_key:
    secret: true
