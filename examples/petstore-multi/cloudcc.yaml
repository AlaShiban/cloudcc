app: petstore-multi
provider: aws

execution_units:
  api:
    type: lambda
    environment_variables:
      LOG_LEVEL: info
    # How big the function is, and how long it may run.
    #
    # Spelled the way OpenTofu and Terraform spell these arguments, which is
    # also how Pulumi's Python and YAML SDKs spell them -- Pulumi's AWS provider
    # is generated from Terraform's, so the two describe the same arguments and
    # differ only in case. The compiler translates; the file does not have to be
    # rewritten if the backend changes.
    resources:
      # This unit imports SQLAlchemy, asyncpg and redis on top of FastAPI, and
      # the default 512 MB spends most of a cold start importing them. Lambda
      # allocates CPU in proportion to memory, so this buys startup as much as
      # it buys headroom.
      memory_size: 1024
      # arm64 is cheaper per millisecond and the bundle is built for whatever
      # is named here, so this is not free to change -- which is the point of
      # it being one line rather than a build flag.
      architectures: [arm64]
  worker:
    type: lambda
    resources:
      # The worker signs a record, writes it to S3 and writes a row to its
      # database, all after the API has already replied. Nothing is waiting on
      # it, and a timeout here is a lost audit record rather than a slow
      # response, so it gets room.
      timeout: 120
      memory_size: 512
      architectures: [arm64]
