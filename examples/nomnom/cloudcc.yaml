app: nomnom
provider: aws

# Six units, every one of them a Lambda. Nothing here says which units talk to
# which: that is in the code, and the compiler reads it.
execution_units:
  storefront:
    type: function
  pricing:
    type: function
  inventory:
    type: function
  dispatch:
    type: function
  tracking:
    type: function
  notify:
    type: function

logging:
  type: cloudwatch
  retention_days: 14
