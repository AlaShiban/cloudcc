name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # Compilation must need no network. Rather than asserting that, this job
  # takes the network away after fetching dependencies and runs the whole
  # offline half of the suite without it.
  offline:
    name: unit + golden (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit and golden tests
        run: go test ./... -count=1

      - name: Sweep generated programs
        run: CLOUDCC_FUZZ_SEEDS=150 go test ./internal/fuzz -run TestSweep -timeout 20m

      - name: Sweep generated Node programs
        run: CLOUDCC_FUZZ_SEEDS=150 go test ./internal/fuzz -run TestNodeSweep -timeout 20m

      - name: Prove compilation needs no network
        run: |
          docker pull --quiet golang:${{ env.GO_VERSION }}-bookworm
          # --network none removes networking entirely -- not just the proxy,
          # the whole namespace. The module cache is mounted in, so nothing
          # legitimate needs fetching and anything reaching for the network
          # fails loudly. GOPROXY=off turns a stray fetch into a clear error
          # rather than a DNS timeout.
          #
          # This image has no python3, so the few assertions that shell out to
          # it skip here; the run above already covered them.
          docker run --rm --network none \
            -v "$PWD":/src -w /src \
            -v "$(go env GOMODCACHE)":/go/pkg/mod \
            -e GOPROXY=off -e GOFLAGS=-mod=mod \
            golang:${{ env.GO_VERSION }}-bookworm \
            go test ./... -count=1

      - uses: astral-sh/setup-uv@v5

      - name: Python SDK suite
        working-directory: sdk/python
        run: uv run --with pytest --with-editable . python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The Node SDK's tests import from dist/, so they need a build first.
      # Among them is the parity test, which is the only thing holding the SDK
      # classes and their injected shims together -- a drift there produces a
      # program that runs locally and fails once compiled, which is precisely
      # the failure this project exists to prevent.
      - name: Node SDK suite
        working-directory: sdk/node
        run: |
          npm ci
          npm run build
          npm test

      # The icon diagram is generated as a Python program, and the two ways it
      # can be wrong are both silent: a class name that is not in the diagrams
      # package, and a call site the imports did not bind. Installing the
      # package makes TestEveryMappedClassExists run instead of skip, and
      # rendering a real example proves the program executes.
      - name: Architecture diagram, rendered
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          uv venv /tmp/diagrams-venv
          uv pip install --python /tmp/diagrams-venv/bin/python diagrams
          PATH="/tmp/diagrams-venv/bin:$PATH" go test ./internal/topology
          go run ./cmd/cloudcc ./examples/petstore -o /tmp/diagram-check
          cd /tmp/diagram-check/petstore && /tmp/diagrams-venv/bin/python architecture.py
          test -s petstore-architecture.png

      # Every argument name in the two provider-args tables is checked against
      # Pulumi's own type definitions, which is the only thing that actually
      # proves them -- `memorySize` against `memory_size`, `ephemeralStorage`
      # against `ephemeral_storage`, `sizeInGib` against `size_in_gib`. A wrong
      # name compiles, emits, deploys and is silently ignored by the provider.
      #
      # kitchen-sink because it is the only example with both compute types, and
      # the emulator implements neither ECS nor an ALB, so it is never deployed
      # by the integration job below. Without this step its task definition
      # arguments have no check at all beyond a golden file that would happily
      # pin a misspelling.
      - name: The generated project type-checks against Pulumi's types
        run: |
          go run ./cmd/cloudcc ./examples/kitchen-sink -o /tmp/typecheck
          cd /tmp/typecheck/kitchen-sink
          npm install --silent --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit

  integration:
    name: provisioning + functional (emulator)
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack
        ports: ["4566:4566"]
        # No --health-cmd: the healthcheck runs inside the container, which has
        # no curl, so the emulator was being marked unhealthy while serving
        # perfectly well. The job waits from the runner side instead.
        #
        # The Docker socket is what lets the emulator back Lambda, RDS and ECS
        # with real processes rather than mocks.
        options: >-
          -v /var/run/docker.sock:/var/run/docker.sock

    env:
      MINISTACK_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      PULUMI_CONFIG_PASSPHRASE: cloudcc-ci
      PULUMI_SKIP_UPDATE_CHECK: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5

      - uses: pulumi/actions@v6


      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Wait for the emulator
        run: ./hack/wait-for.sh "$MINISTACK_ENDPOINT" 120

      - name: Toolchain check
        run: |
          go build -o cloudcc ./cmd/cloudcc
          ./cloudcc doctor

      # Runs the injected Node client shims against a real Redis and Postgres.
      # Everything else about them is checked without connecting, which proved
      # not to be enough: this caught the pg shim handing over an empty
      # password where it should have said nothing at all.
      - name: Node client shims against real servers
        run: ./tests/e2e/node-clients.sh

      - name: Provisioning and functional tests
        run: ./tests/e2e/ministack.sh

      # The same gate for a Node application: the harness is parameterised by
      # example, and everything below the language frontend is shared, so this
      # is the check that the seam actually holds.
      - name: Provisioning and functional tests (Node)
        run: ./tests/e2e/ministack.sh petstore-node

      # A multi-unit application whose entry module is not called app.py. It
      # was never run here before, because the harness hardcoded `uvicorn
      # app:app`; it now asks the compiler which module holds the application,
      # which is a fact the compiler already worked out.
      - name: Provisioning and functional tests (multi-unit)
        run: ./tests/e2e/ministack.sh petstore-multi api

      # One application, two languages, one store. The architecture has always
      # claimed to support this -- a frontend is chosen per execution unit --
      # but nothing checked it until there was an example that deploys.
      - name: Provisioning and functional tests (mixed languages)
        run: ./tests/e2e/ministack.sh mixed api

      # Six units talking to each other two ways. This is the only test in the
      # suite where a deployed unit calls another deployed unit -- dispatch,
      # woken by a message, invokes inventory and waits for the answer -- and
      # the only one that follows a chain across five units to the state it
      # leaves in every store. It also probes each unit for a clean start,
      # which is the check that catches an environment binding a unit needs but
      # has no edge for: invisible locally, fatal on the first invocation.
      - name: Provisioning and functional tests (cross-unit calls and messages)
        run: ./tests/e2e/nomnom.sh

      # Every example, run as written and again after compiling, with the same
      # requests replayed against both. The generated-program harness below
      # covers more shapes; this covers the code a newcomer actually reads, and
      # it checks that each application's architecture diagram matches the
      # resources the stack really created.
      - name: Every example, uncompiled vs compiled
        run: ./tests/e2e/examples.sh

      # Throughput before and after compiling, and -- the part a load test does
      # not usually do -- a check that every edge the compiler drew actually
      # carried traffic. A store nothing wrote to and a subscriber that never
      # woke are both green deploys and broken applications.
      #
      # Scaled down, and one example rather than all of them. What dominates
      # here is npm install and `pulumi up`, not the load, so a smaller scale
      # saves little and running every example would roughly double this job --
      # for coverage the differential suite above already provides.
      #
      # nomnom is the one worth the minutes: fourteen runtime edges, including
      # every kind this can check -- a call between deployed units, two topics
      # with three subscribers between them, five tables and a bucket. Run the
      # rest locally with `make load`.
      - name: Load, connectedness and the before/after benchmark
        run: CLOUDCC_LOAD_SCALE=0.25 ./tests/e2e/load.sh nomnom
        env:
          CLOUDCC_LOAD_REPORTS: ${{ runner.temp }}/loadtest

      - name: Upload the load-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-reports
          path: ${{ runner.temp }}/loadtest
          if-no-files-found: ignore

      - name: cloudcc deploy end to end
        run: ./tests/e2e/deploy.sh

      - name: Differential test -- uncompiled vs compiled behaviour
        run: ./tests/e2e/differential.sh 1 2 3

      # The same comparison for Node. Both languages run the program as written
      # against the SDK's emulations, then compiled against the emulator, and
      # require identical responses.
      - name: Differential test -- Node
        run: CLOUDCC_DIFF_LANG=node ./tests/e2e/differential.sh 1 2 3

      - name: Upload the work directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: /tmp/cloudcc-e2e-*
          if-no-files-found: ignore
          retention-days: 3
